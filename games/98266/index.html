<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft | Nimo Games</title>
  <meta name="description" content="Explora, construye y sobrevive en Minecraft desde el navegador con Nimo Games.">
  <link rel="canonical" href="https://nimogames.qzz.io/games/98266/index.html">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
    <script defer src="/assets/js/nimo-sdk.js" data-loading="true"></script>
</head>
<body>
  <iframe
    src="https://retrodotgg.github.io/Minecraft-Launcher-Web/"
    title="Minecraft"
    allowfullscreen
  ></iframe>
  <script>
    const minecraftFrame = document.querySelector("iframe");
    const retryKey = "minecraft-launcher-initial-retry";

    if (!sessionStorage.getItem(retryKey)) {
      sessionStorage.setItem(retryKey, "true");
      minecraftFrame.addEventListener(
        "load",
        () => {
          window.setTimeout(() => {
            minecraftFrame.src = minecraftFrame.src;
          }, 1000);
        },
        { once: true }
      );
    }
  </script>
</body>
</html>
