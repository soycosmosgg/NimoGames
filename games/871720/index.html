    <script>
      window.nimoRuntimeReady = new Promise((resolve, reject) => {
        const cdnBases = [
          window.NIMO_CDN_BASE,
          ...(window.NIMO_CDN_BASES || []).map(cdn => cdn.base)
        ].filter((base, index, bases) => base && bases.indexOf(base) === index);

        function loadRuntime(index) {
          if (index >= cdnBases.length) {
            reject(new Error("No se pudo cargar el runtime de UCN desde ninguna CDN."));
            return;
          }
          const runtimeScript = document.createElement("script");
          runtimeScript.src = new URL("src/Runtime.js", cdnBases[index]).href;
          runtimeScript.fetchPriority = "high";
          let settled = false;
          const fallback = () => {
            if (settled) return;
            settled = true;
            clearTimeout(timeout);
            runtimeScript.remove();
            loadRuntime(index + 1);
          };
          const timeout = setTimeout(fallback, 2000);
          runtimeScript.onload = () => {
            if (settled) return;
            settled = true;
            clearTimeout(timeout);
            if (index > 0) {
              const baseElement = document.querySelector("base");
              if (baseElement) baseElement.href = cdnBases[index];
              window.NIMO_CDN_BASE = cdnBases[index];
              console.warn("[UCN] Runtime cargado desde una CDN alternativa.", runtimeScript.src);
            }
            resolve();
          };
          runtimeScript.onerror = fallback;
          document.head.appendChild(runtimeScript);
        }

        loadRuntime(0);
      });
    </script>

  <script>

	// Detection of when the html file is ran locally.
	// You can remove this code for the final version
	if (window.location.protocol == "file:")
	{

		document.write('or upload your application folder to a remote web-server, and start it from there...</p>');

		throw new Error("Cannot run application");
	}

<script>
    // RUNTIMESTART
    // This is where the HTML5 runtime is actually started
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        await window.nimoRuntimeReady;
        new Runtime("MMFCanvas", "resources/UCNHTML5.cch");
      } catch (error) {
        console.error("[UCN] No se pudo iniciar el juego.", error);
        const message = document.createElement("p");
        message.textContent = "No se pudo cargar Ultimate Custom Night. Recarga la página para intentarlo de nuevo.";
        message.style.cssText = "position:fixed;inset:auto 16px 16px;padding:12px;background:#300;color:#fff;font:16px system-ui";
        document.body.appendChild(message);
      }
    }, { once: true });
    // RUNTIMESTARTEND
</script>
