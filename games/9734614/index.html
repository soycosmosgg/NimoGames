<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Polytrack | Nimo Games</title>
    <meta name="description" content="Race on fast, loop-filled tracks in Polytrack, a low-poly driving game with time trials and custom tracks.">
    <link rel="canonical" href="https://nimogames.qzz.io/games/9734614/index.html">
    <script src="/assets/js/nimo-sdk.js"
            data-base="https://cdn.jsdelivr.net/gh/Hikidsmmmm/Polytrack-0.6.0@main/"
            data-probe="simulation_worker.bundle.js"
            data-game-id="9734614" data-loading="true"></script>
    <script>
        const polytrackBase = (window.NIMO_CDN_BASE ||
            "https://cdn.jsdelivr.net/gh/Hikidsmmmm/Polytrack-0.6.0@main/").replace(/\/?$/, '/');
        let polytrackBaseElement = document.querySelector('base');
        if (!polytrackBaseElement) {
            polytrackBaseElement = document.createElement('base');
            document.head.prepend(polytrackBaseElement);
        }
        polytrackBaseElement.href = polytrackBase;
        window.__POLYTRACK_BASE_URL = polytrackBase;
        for (const [path, as, type] of [
            ["forced_square.woff2", "font", "font/woff2"],
            ["images/logo.svg", "image", "image/svg+xml"],
            ["images/discord.svg", "image", "image/svg+xml"]
        ]) {
            const preload = document.createElement("link");
            preload.rel = "preload";
            preload.href = new URL(path, polytrackBase).href;
            preload.as = as;
            if (type) preload.type = type;
            if (as === "font") preload.crossOrigin = "anonymous";
            document.head.appendChild(preload);
        }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2328346a'/%3E%3C/svg%3E">

    <script>
        window.jkdfgnjkndfg = window.__POLYTRACK_BASE_URL;
        const simulationWorkerReady = (async () => {
            const baseUrl = window.jkdfgnjkndfg.replace(/\/?$/, '/');
            const workerUrl = `${baseUrl}simulation_worker.bundle.js`;
            const response = await fetch(workerUrl);
            if (!response.ok) {
                throw new Error(`PolyTrack worker request failed: HTTP ${response.status} (${workerUrl})`);
            }
            const text = await response.text();
            const scriptBase = `${baseUrl}lib/`;
            const workerPrefix = [
                `self.POLYTRACK_BASE_URL=${JSON.stringify(scriptBase)};`,
                `const __POLYTRACK_ROOT_URL=${JSON.stringify(baseUrl)};`,
                `const __ORIGINAL_fetch = self.fetch.bind(self);`,

                `self.fetch = function(input, init) {`,
                `    if (typeof input === 'string' && !/^[a-zA-Z][a-zA-Z\\d+\\-.]*:/.test(input) && !input.startsWith('//')) {`,
                `        input = self.POLYTRACK_BASE_URL + input.replace('./', '');`,
                `    }`,

                `    return __ORIGINAL_fetch(input, init);`,
                `};`,
                `const __ORIGINAL_XHR_open = XMLHttpRequest.prototype.open;`,
                `XMLHttpRequest.prototype.open = function(method, url, ...rest) {`,
                `    if (typeof url === 'string' && !/^[a-zA-Z][a-zA-Z\\d+\\-.]*:/.test(url) && !url.startsWith('//')) {`,
                `        url = self.POLYTRACK_BASE_URL + url.replace('./', '');`,
                `    }`,

                `    return __ORIGINAL_XHR_open.call(this, method, url, ...rest);`,
                `};`,
                `self.__POLYTRACK_WRAP = function() {`,
                `    if (typeof PolyTrackPhysics !== 'function') return;`,
                `    const __ORIGINAL_PolyTrackPhysics = PolyTrackPhysics;`,
                `    PolyTrackPhysics = function(options = {}) {`,
                `        if (!options.locateFile) {`,
                `            options.locateFile = function(path) {`,
                `                if (/\.wasm$/.test(path)) {`,
                `                    return __POLYTRACK_ROOT_URL + path.replace('./', '');`,
                `                }`,

                `                return self.POLYTRACK_BASE_URL + path.replace('./', '');`,

                `            };`,
                `        }`,

                `        return __ORIGINAL_PolyTrackPhysics(options);`,
                `    };`,
                `};`
            ].join('\n');
            const patchedText = workerPrefix + '\n' + text
                .replaceAll("replacethisplease", baseUrl)
                .replace(/importScripts\((['"])lib\/polytrack_physics\.js\1\)/g, (match, quote) => {
                    return `importScripts(${quote}${baseUrl}lib/polytrack_physics.js${quote});\n` +
                        `self.__POLYTRACK_WRAP();`;
                });
            const blob = new Blob([patchedText], { type: 'application/javascript' });
            window.simulationworker = URL.createObjectURL(blob);
            return window.simulationworker;
        })().catch(error => {
            console.error('Failed to load simulation worker bundle:', error);
            throw error;
        });

        const ogworker = window.Worker;
        function createSimulationWorkerProxy(options) {
            let realWorker = null;
            const pendingCalls = [];
            const pendingSets = [];
            const proxy = new Proxy({ onmessage: null, onerror: null, onmessageerror: null }, {
                get(target, prop) {
                    if (prop === 'then') return undefined;
                    if (realWorker) {
                        const value = realWorker[prop];
                        return typeof value === 'function' ? value.bind(realWorker) : value;
                    }
                    if (prop === 'postMessage' || prop === 'terminate' || prop === 'addEventListener' || prop === 'removeEventListener') {
                        return (...args) => {
                            pendingCalls.push({ name: prop, args });
                        };
                    }
                    return target[prop];
                },
                set(target, prop, value) {
                    if (prop === 'onmessage' || prop === 'onerror' || prop === 'onmessageerror') {
                        target[prop] = value;
                        if (realWorker) realWorker[prop] = value;
                        return true;
                    }
                    pendingSets.push({ name: prop, value });
                    if (realWorker) realWorker[prop] = value;
                    return true;
                }
            });

            simulationWorkerReady.then(workerUrl => {
                realWorker = new ogworker(workerUrl, options);
                pendingCalls.forEach(call => {
                    if (typeof realWorker[call.name] === 'function') {
                        realWorker[call.name](...call.args);
                    }
                });
                pendingSets.forEach(set => {
                    realWorker[set.name] = set.value;
                });
                if (proxy.onmessage) realWorker.onmessage = proxy.onmessage;
                if (proxy.onerror) realWorker.onerror = proxy.onerror;
                if (proxy.onmessageerror) realWorker.onmessageerror = proxy.onmessageerror;
            }).catch(() => {
                console.error('Simulation worker failed to initialize');
            });

            return proxy;
        }

        function isSimulationWorkerScript(scriptUrl) {
            if (typeof scriptUrl === 'string') {
                return scriptUrl.toLowerCase().endsWith('simulation_worker.bundle.js');
            }
            if (scriptUrl instanceof URL) {
                return scriptUrl.pathname.toLowerCase().endsWith('simulation_worker.bundle.js');
            }
            if (scriptUrl instanceof Request) {
                return scriptUrl.url.toLowerCase().endsWith('simulation_worker.bundle.js');
            }
            return false;
        }

        window.Worker = function (scriptUrl, options) {
            if (isSimulationWorkerScript(scriptUrl)) {
                return createSimulationWorkerProxy(options);
            }
            return new ogworker(scriptUrl, options);
        };
        window.Worker.prototype = ogworker.prototype;
    </script>
    <script>
        for (const path of ["error_screen.bundle.js", "main.bundle.js"]) {
            const gameScript = document.createElement("script");
            gameScript.src = new URL(path, window.__POLYTRACK_BASE_URL).href;
            gameScript.async = false;
            gameScript.onerror = () => {
                console.error(`PolyTrack failed to load ${gameScript.src}`);
            };
            document.head.appendChild(gameScript);
        }
    </script>
  </head>

  <body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>
  </body>
</html>
